name: Deploy to SparkedHost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: 2022
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          source: ".,!node_modules,!.env,!.git,!.github,!Dockerfile,!nixpacks.toml"
          target: "/home/container"

      - name: Restart server
        run: |
          curl -s -X POST "https://control.sparkedhost.us/api/client/servers/4fdb618c/power" \
            -H "Authorization: Bearer ${{ secrets.PANEL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"signal":"restart"}'
