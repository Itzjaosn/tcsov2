name: Deploy to SparkedHost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files via SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            set ssl:verify-certificate no;
            open sftp://${{ secrets.SFTP_USERNAME }}:$SFTP_PASSWORD@${{ secrets.SFTP_HOST }}:2022;
            mirror -R --exclude=node_modules/ --exclude=.git/ --exclude=.env --exclude=.github/ ./ /home/container/;
            bye
          "

      - name: Restart server
        run: |
          curl -s -X POST "https://control.sparkedhost.us/api/client/servers/4fdb618c/power" \
            -H "Authorization: Bearer ${{ secrets.PANEL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"signal":"restart"}'
